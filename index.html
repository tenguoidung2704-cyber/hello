<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Rạp Party 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root {
  --bg: #07070c;
  --fg: #f4f4f8;
  --pn: rgba(18, 18, 32, 0.78);
  --ac: #ff4d6d;
  --ac2: #7b61ff;
  --bd: rgba(255, 255, 255, 0.15);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  touch-action: none;
  user-select: none;
}
canvas {
  position: fixed;
  inset: 0;
  display: block;
}
.pn {
  background: var(--pn);
  border: 1px solid var(--bd);
  border-radius: 16px;
  padding: 8px 12px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}

/* Thẻ tên & Bong bóng chat trên đầu nhân vật */
.tag {
  position: fixed;
  left: 0;
  top: 0;
  pointer-events: none;
  text-align: center;
  font-size: 12px;
  white-space: nowrap;
  text-shadow: 0 1px 3px #000;
  will-change: transform;
  z-index: 3;
}
.tag .nm {
  background: rgba(10, 10, 20, 0.68);
  border: 1px solid rgba(255, 255, 255, 0.15);
  padding: 2px 9px;
  border-radius: 99px;
  font-weight: 600;
  display: inline-block;
  backdrop-filter: blur(4px);
}
.tag.me .nm {
  background: linear-gradient(135deg, var(--ac), #ff758f);
  border-color: rgba(255, 255, 255, 0.4);
  color: #fff;
  box-shadow: 0 2px 10px rgba(255, 77, 109, 0.5);
}
.tag .em {
  display: block;
  font-size: 28px;
  line-height: 1.1;
  margin-bottom: 4px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  animation: emoPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.tag .bb {
  display: block;
  background: rgba(255, 255, 255, 0.95);
  color: #111;
  font-weight: 500;
  border-radius: 14px;
  border-bottom-left-radius: 4px;
  padding: 5px 11px;
  margin: 0 auto 6px;
  max-width: 210px;
  white-space: normal;
  text-shadow: none;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  animation: bbPop 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}
.tag .bb::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 5px 5px 0;
  border-style: solid;
  border-color: rgba(255, 255, 255, 0.95) transparent;
}
@keyframes bbPop {
  0% { opacity: 0; transform: scale(0.5) translateY(10px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes emoPop {
  0% { opacity: 0; transform: scale(0.3) translateY(12px); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

/* Emote & Chat bay lên kiểu Livestream */
.fly-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 4;
  overflow: hidden;
}
.fly-emo {
  position: absolute;
  font-size: 30px;
  pointer-events: none;
  will-change: transform, opacity;
  filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.45));
  animation: floatUpStream 2.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
.fly-chat {
  position: absolute;
  pointer-events: none;
  will-change: transform, opacity;
  background: rgba(15, 15, 28, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #fff;
  padding: 4px 11px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 500;
  backdrop-filter: blur(6px);
  box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  white-space: nowrap;
  max-width: 240px;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: floatUpStream 3.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
}
@keyframes floatUpStream {
  0% {
    opacity: 0;
    transform: translate(-50%, 10px) scale(0.4);
  }
  12% {
    opacity: 1;
    transform: translate(calc(-50% + var(--w1, 12px)), -25px) scale(1.1);
  }
  45% {
    opacity: 1;
    transform: translate(calc(-50% + var(--w2, -14px)), -95px) scale(1);
  }
  75% {
    opacity: 0.85;
    transform: translate(calc(-50% + var(--w3, 10px)), -165px) scale(0.95);
  }
  100% {
    opacity: 0;
    transform: translate(calc(-50% + var(--w4, -8px)), -230px) scale(0.75);
  }
}

/* Thanh trên cùng */
#top {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 10px;
  right: 10px;
  display: flex;
  gap: 8px;
  justify-content: space-between;
  align-items: flex-start;
  pointer-events: none;
  z-index: 5;
}
#top > * { pointer-events: auto; }
#st {
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
}

button {
  font: inherit;
  color: var(--fg);
  background: var(--pn);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 8px 13px;
  cursor: pointer;
  transition: transform 0.15s ease, background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
}
button:hover {
  background: rgba(40, 40, 68, 0.9);
  border-color: rgba(255, 255, 255, 0.3);
}
button:active {
  transform: scale(0.92);
}
button.p {
  background: linear-gradient(135deg, var(--ac), #ff758f);
  border-color: rgba(255, 255, 255, 0.25);
  color: #fff;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
}
button.p:hover {
  box-shadow: 0 6px 20px rgba(255, 77, 109, 0.65);
}
button.fw-btn {
  background: linear-gradient(135deg, #ff9a4d, #ff4d6d, #7b61ff);
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 4px 16px rgba(255, 77, 109, 0.45);
}

input {
  font: inherit;
  font-size: 15px;
  color: var(--fg);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 8px 13px;
  min-width: 0;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
}
input:focus {
  border-color: var(--ac);
  background: rgba(255, 255, 255, 0.13);
}

/* Khu vực bên dưới: Khung chat Livestream & Thanh công cụ */
#bot {
  position: fixed;
  left: 10px;
  right: 10px;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  z-index: 5;
}
#bot > * { pointer-events: auto; }

/* Khung chat Livestream bên góc trái dưới */
#log {
  align-self: flex-start;
  font-size: 13.5px;
  width: min(380px, 78vw);
  max-height: 220px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 6px;
  overflow: hidden;
  pointer-events: none !important;
  padding: 12px 4px 4px 2px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 18%, #000 38%, #000 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.4) 18%, #000 38%, #000 100%);
}
.chat-item {
  background: linear-gradient(90deg, rgba(14, 14, 26, 0.82) 0%, rgba(24, 24, 42, 0.65) 100%);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-left: 3px solid var(--c, #ff4d6d);
  border-radius: 14px;
  padding: 6px 12px;
  width: fit-content;
  max-width: 100%;
  backdrop-filter: blur(8px);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  line-height: 1.35;
  word-break: break-word;
  transform-origin: left bottom;
  animation: liveChatIn 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.chat-item.fade-out {
  opacity: 0;
  transform: translateY(-12px) scale(0.95);
}
.chat-item .c-badge {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--c, #ff4d6d);
  margin-right: 6px;
  box-shadow: 0 0 6px var(--c, #ff4d6d);
}
.chat-item .c-user {
  font-weight: 700;
  color: var(--c, #ff8fa3);
  margin-right: 6px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.6);
}
.chat-item .c-msg {
  color: #f8f8fc;
}
@keyframes liveChatIn {
  0% {
    opacity: 0;
    transform: translateY(24px) scale(0.85);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

#emo {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  background: rgba(14, 14, 26, 0.72);
  border: 1px solid var(--bd);
  padding: 5px 8px;
  border-radius: 99px;
  backdrop-filter: blur(12px);
}
#emo button {
  font-size: 20px;
  padding: 5px 10px;
  border-radius: 99px;
  background: transparent;
  border-color: transparent;
}
#emo button:hover {
  background: rgba(255, 255, 255, 0.14);
  transform: translateY(-3px) scale(1.12);
}
