<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>Rạp Party</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#07070c;--fg:#f4f4f8;--pn:rgba(18,18,30,.82);--ac:#ff4d6d;--bd:rgba(255,255,255,.14);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07070c;--fg:#f4f4f8;--pn:rgba(18,18,30,.82)}}
:root[data-theme="dark"]{--bg:#07070c;--fg:#f4f4f8;--pn:rgba(18,18,30,.82)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;display:block}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:8px 10px;backdrop-filter:blur(8px)}
.tag{position:fixed;left:0;top:0;pointer-events:none;text-align:center;font-size:12px;white-space:nowrap;text-shadow:0 1px 3px #000;will-change:transform}
.tag .nm{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:9px;font-weight:600}
.tag .em{display:block;font-size:28px;line-height:1.1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.tag .bb{display:block;background:#fff;color:#111;border-radius:12px;padding:4px 10px;margin-bottom:4px;max-width:190px;white-space:normal;text-shadow:none;font-weight:500;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.tag.me .nm{background:var(--ac)}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:8px;right:8px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#st{font-size:12px}
button{font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;cursor:pointer;transition:transform .12s,background .15s}
button:active{transform:scale(.92)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
input{font:inherit;font-size:16px;color:var(--fg);background:rgba(255,255,255,.08);border:1px solid var(--bd);border-radius:10px;padding:7px 10px;min-width:0}
#bot{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#bot>*{pointer-events:auto}

/* Khung chat kiểu Livestream trôi từ dưới lên */
#log{
  align-self:flex-start;
  font-size:13px;
  width:min(360px,78vw);
  max-height:190px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  gap:5px;
  overflow:hidden;
  pointer-events:none!important;
  padding:6px 2px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 22%,black 100%);
  mask-image:linear-gradient(to bottom,transparent 0%,black 22%,black 100%);
}
.cmsg{
  background:rgba(12,12,22,.68);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  border-radius:16px;
  padding:5px 12px;
  width:fit-content;
  max-width:100%;
  word-break:break-word;
  line-height:1.35;
  box-shadow:0 2px 8px rgba(0,0,0,.25);
  animation:chatUp .28s cubic-bezier(.2,.9,.3,1) forwards;
}
.cmsg b{margin-right:5px}
.cmsg.fade{opacity:0;transform:translateY(-8px);transition:opacity .4s,transform .4s}
@keyframes chatUp{
  0%{opacity:0;transform:translateY(22px) scale(.92)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Hiệu ứng Emote & Chat bay lên kiểu Livestream */
#fly-box{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.fly-item{
  position:absolute;
  will-change:transform,opacity;
  pointer-events:none;
  user-select:none;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.45));
  animation:flyStream var(--dur,3s) cubic-bezier(.22,.68,.35,1) forwards;
}
.fly-item.emo{font-size:30px}
.fly-item.txt{
  background:linear-gradient(135deg,rgba(255,77,109,.9),rgba(130,60,255,.9));
  color:#fff;
  font-size:12px;
  font-weight:600;
  padding:4px 11px;
  border-radius:20px;
  border:1px solid rgba(255,255,255,.3);
  max-width:200px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
@keyframes flyStream{
  0%{opacity:0;transform:translate(0,15px) scale(.4)}
  12%{opacity:1;transform:translate(calc(var(--sway,20px) * .3),-25px) scale(1.1)}
  55%{opacity:.95;transform:translate(calc(var(--sway,20px) * -.6),-140px) scale(1)}
  100%{opacity:0;transform:translate(var(--sway,20px),-270px) scale(.8)}
}

#emo{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#emo button{font-size:20px;padding:5px 9px}
#emo button.fw-btn{background:linear-gradient(135deg,#ff4d6d,#ff9a4d);border-color:#ffb070}
#cf{display:flex;gap:6px;width:min(460px,100%)}
#cf input{flex:1}
#vid{position:fixed;left:0;top:0;transform-origin:0 0;border:0;background:#000;display:none;z-index:1;pointer-events:none}
#top,#bot,#scr,#joy,.tag{z-index:3}
#scr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 52px);right:8px;width:min(300px,calc(100vw - 16px));display:none;flex-direction:column;gap:6px;font-size:13px}
#scr a{color:var(--ac);text-decoration:none;font-weight:600}
#joy{position:fixed;left:18px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid var(--bd);display:none}
#kn{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.4)}
@media (pointer:coarse){#joy{display:block}}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(7,7,12,.88);z-index:9}
#ov .pn{width:min(340px,90vw);display:flex;flex-direction:column;gap:10px;padding:18px}
#ov h1{margin:0;font-size:20px}
#sw{display:flex;gap:8px}
#sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}
#sw i.on{border-color:#fff}
.sm{font-size:12px;opacity:.75;line-height:1.4}
</style></head><body>
<div id="top"><div id="st" class="pn">Đang kết nối…</div><button id="bscr">📺 Màn hình</button></div>
<div id="scr" class="pn">
<input id="stt" maxlength="60" placeholder="Tên giải / trận đấu">
<input id="stu" maxlength="300" placeholder="Link livestream (https://…)">
<button id="sgo" class="p">Cập nhật cho cả phòng</button>
<a id="sop" href="#" target="_blank" rel="noopener noreferrer" style="display:none">Mở stream ↗</a>
<span class="sm">Dán link YouTube hoặc Twitch để chiếu thẳng lên màn hình rạp (ngồi vào ghế để bấm điều khiển, bật tiếng). Link khác thì hiện nút mở tab mới.</span>
</div>
<iframe id="vid" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
<div id="fly-box"></div>
<div id="joy"><div id="kn"></div></div>
<div id="bot"><div id="log"></div><div id="emo"></div>
<form id="cf"><input id="ci" maxlength="120" placeholder="Nhập tin nhắn livestream…" autocomplete="off"><button class="p">Gửi</button></form></div>
<div id="ov"><div class="pn"><h1>🎬 Rạp Party</h1>
<input id="nm" maxlength="14" placeholder="Tên của bạn">
<div id="sw"></div>
<button id="go" class="p">Vào rạp</button>
<span class="sm">WASD / phím mũi tên để đi, F để ngồi ghế, G hoặc 🎆 để bắn pháo hoa ăn mừng, bấm emote để thả cảm xúc bay lên!</span></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const COLORS=['#ff4d6d','#4dabff','#ffd24d','#5ee08a','#b57bff','#ff9a4d'];
let myColor=COLORS[Math.floor(Math.random()*6)],started=false,room=null;
COLORS.forEach(c=>{const i=document.createElement('i');i.style.background=c;if(c===myColor)i.className='on';i.onclick=()=>{myColor=c;document.querySelectorAll('#sw i').forEach(x=>x.className=x===i?'on':'')};$('#sw').appendChild(i)});
$('#nm').value='Khách'+Math.floor(Math.random()*900+100);

// ---- scene ----
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07070c);scene.fog=new THREE.Fog(0x07070c,18,45);
const cam=new THREE.PerspectiveCamera(60,1,.1,100);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new THREE.HemisphereLight(0x99aaff,0x301825,.85));
const pl=new THREE.PointLight(0xaabbff,1.1,40);pl.position.set(0,5,-5);scene.add(pl);
const M=(c)=>new THREE.MeshLambertMaterial({color:c});
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);scene.add(m);return m}
box(22,.2,22,0x2a1424,0,-.1,0);
box(22,9,.4,0x14141f,0,4.5,-10.2);box(.4,9,22,0x14141f,-11,4.5,0);box(.4,9,22,0x14141f,11,4.5,0);
box(22,.4,22,0x0b0b12,0,9,0);
const SD=2.6,Z0=-2.3,NR=4,seats=[];
function ground(z){return z<Z0?0:Math.min(NR,Math.floor((z-Z0)/SD)+1)*.3}
for(let r=0;r<NR;r++){
  const zc=Z0+SD*r+SD/2,top=(r+1)*.3;
  box(21,top,SD,0x3a1828,0,top/2,zc);
  for(let k=0;k<7;k++){const x=-4.5+k*1.5,z=zc+.2;
    box(1,.45,.8,0xb02a45,x,top+.22,z);box(1,.7,.18,0x8a1f36,x,top+.6,z+.4);
    seats.push({x,z,y:top});}
}
// screen
const cv=document.createElement('canvas');cv.width=1024;cv.height=576;
const tx=new THREE.CanvasTexture(cv);
const scrM=new THREE.Mesh(new THREE.PlaneGeometry(12,6.75),new THREE.MeshBasicMaterial({map:tx}));
scrM.position.set(0,4.6,-9.95);scene.add(scrM);
box(12.4,7.15,.1,0x000000,0,4.6,-10.02);
let scr={t:'Chưa có trận nào',u:'',mine:false};
function wrap(c,t,x,y,w,lh){const ws=t.split(' ');let l='';for(const s of ws){const n=l?l+' '+s:s;if(c.measureText(n).width>w&&l){c.fillText(l,x,y);y+=lh;l=s}else l=n}c.fillText(l,x,y);return y}
function drawScr(){
  const c=cv.getContext('2d');
  const g=c.createLinearGradient(0,0,1024,576);g.addColorStop(0,'#1a1040');g.addColorStop(1,'#401030');
  c.fillStyle=g;c.fillRect(0,0,1024,576);
  c.fillStyle='#fff';c.textAlign='center';c.font='bold 64px sans-serif';
  wrap(c,scr.t,512,250,880,76);
  const on=Math.floor(Date.now()/700)%2===0;
  c.fillStyle=on?'#ff2d4d':'#8a1b2c';c.beginPath();c.roundRect?c.roundRect(40,36,130,56,14):c.rect(40,36,130,56);c.fill();
  c.fillStyle='#fff';c.font='bold 34px sans-serif';c.fillText('● LIVE',105,76);
  c.font='30px sans-serif';c.fillStyle='rgba(255,255,255,.75)';
  c.fillText('👥 '+(Object.keys(rem).length+1)+' người trong rạp',512,520);
  tx.needsUpdate=true;
}

// ---- Nhân vật đầy đủ tay chân & khuôn mặt dễ thương ----
function mkAv(name,color,isMe){
  const g=new THREE.Group();
  const matBody=M(color);
  const matSkin=M(0xffd6b3);
  const matDark=M(0x222230);
  const matShoe=M(0x181822);
  const matEye=M(0x111111);
  const matWhite=new THREE.MeshBasicMaterial({color:0xffffff});
  const matBlush=new THREE.MeshBasicMaterial({color:0xff758f});
  const matMouth=M(0xd94b64);

  // Thân áo
  const body=new THREE.Mesh(new THREE.CylinderGeometry(.22,.26,.62,16),matBody);
  body.position.y=.72;g.add(body);

  // Đầu
  const headGroup=new THREE.Group();
  headGroup.position.y=1.28;
  const head=new THREE.Mesh(new THREE.SphereGeometry(.26,18,16),matSkin);
  headGroup.add(head);

  // Tóc / Mũ beanie cùng tông màu nhân vật
  const hat=new THREE.Mesh(new THREE.SphereGeometry(.27,16,12,0,Math.PI*2,0,Math.PI*.52),matBody);
  hat.position.y=.03;
  headGroup.add(hat);
  const pom=new THREE.Mesh(new THREE.SphereGeometry(.06,8,8),matWhite);
  pom.position.y=.31;
  headGroup.add(pom);

  // Mắt long lanh + Má hồng + Miệng cười (hướng về +Z)
  for(const s of[-1,1]){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(.038,10,10),matEye);
    eye.position.set(s*.095,.03,.23);
    headGroup.add(eye);
    // Đốm sáng mắt
    const shine=new THREE.Mesh(new THREE.SphereGeometry(.014,6,6),matWhite);
    shine.position.set(s*.095+.012,.045,.26);
    headGroup.add(shine);
    // Má hồng
    const blush=new THREE.Mesh(new THREE.SphereGeometry(.032,8,8),matBlush);
    blush.scale.set(1.3,.6,.5);
    blush.position.set(s*.15,-.03,.215);
    headGroup.add(blush);
  }
  // Miệng cười
  const mouth=new THREE.Mesh(new THREE.TorusGeometry(.038,.012,8,12,Math.PI),matMouth);
  mouth.position.set(0,-.045,.242);
  mouth.rotation.x=Math.PI;
  headGroup.add(mouth);
  g.add(headGroup);

  // Tay trái & phải (có khớp vai để vung tay khi đi / vẫy emote)
  const armL=new THREE.Group();armL.position.set(-.29,.96,0);
  const armMeshL=new THREE.Mesh(new THREE.CylinderGeometry(.06,.055,.45,10),matBody);
  armMeshL.position.y=-.19;armL.add(armMeshL);
  const handL=new THREE.Mesh(new THREE.SphereGeometry(.065,8,8),matSkin);
  handL.position.y=-.43;armL.add(handL);
  g.add(armL);

  const armR=new THREE.Group();armR.position.set(.29,.96,0);
  const armMeshR=new THREE.Mesh(new THREE.CylinderGeometry(.06,.055,.45,10),matBody);
  armMeshR.position.y=-.19;armR.add(armMeshR);
  const handR=new THREE.Mesh(new THREE.SphereGeometry(.065,8,8),matSkin);
  handR.position.y=-.43;armR.add(handR);
  g.add(armR);

  // Chân trái & phải (có khớp hông để bước đi / gập chân ngồi ghế)
  const legL=new THREE.Group();legL.position.set(-.11,.42,0);
  const legMeshL=new THREE.Mesh(new THREE.CylinderGeometry(.075,.065,.42,10),matDark);
  legMeshL.position.y=-.21;legL.add(legMeshL);
  const shoeL=new THREE.Mesh(new THREE.BoxGeometry(.13,.09,.2),matShoe);
  shoeL.position.set(0,-.40,.03);legL.add(shoeL);
  g.add(legL);

  const legR=new THREE.Group();legR.position.set(.11,.42,0);
  const legMeshR=new THREE.Mesh(new THREE.CylinderGeometry(.075,.065,.42,10),matDark);
  legMeshR.position.y=-.21;legR.add(legMeshR);
  const shoeR=new THREE.Mesh(new THREE.BoxGeometry(.13,.09,.2),matShoe);
  shoeR.position.set(0,-.40,.03);legR.add(shoeR);
  g.add(legR);

  scene.add(g);
  const tag=document.createElement('div');tag.className='tag'+(isMe?' me':'');
  tag.innerHTML='<span class="bb" hidden></span><span class="em" hidden></span><span class="nm"></span>';
  tag.querySelector('.nm').textContent=name;document.body.appendChild(tag);
  return{g,headGroup,armL,armR,legL,legR,tag,x:0,y:0,z:0,px:0,pz:0,walk:0,r:Math.PI,s:-1,et:0,ej:0,bt:0,et2:0,color,name};
}

// ---- Hiệu ứng bay lên (Emote & Chat giống livestream) ----
const flyBox=$('#fly-box');
function spawnFly(content,isChat,av){
  const el=document.createElement('div');
  el.className='fly-item '+(isChat?'txt':'emo');
  el.textContent=content;
  let sx=innerWidth-60-Math.random()*50,sy=innerHeight-95;
  if(av){
    const p=new THREE.Vector3(av.g.position.x,av.g.position.y+1.8,av.g.position.z).project(cam);
    if(p.z<1){
      sx=(p.x*.5+.5)*innerWidth+(Math.random()*24-12);
      sy=(-p.y*.5+.5)*innerHeight-20;
    }
  }
  sx=Math.max(30,Math.min(innerWidth-90,sx));
  sy=Math.max(100,Math.min(innerHeight-70,sy));
  el.style.left=sx+'px';
  el.style.top=sy+'px';
  el.style.setProperty('--sway',(Math.random()*70-35)+'px');
  el.style.setProperty('--dur',(2.4+Math.random()*.9)+'s');
  flyBox.appendChild(el);
  setTimeout(()=>el.remove(),3400);

  // Nếu thả emote thì bắn 1 chùm 3 icon bay lên cho xôm tụ giống livestream
  if(!isChat){
    for(let i=1;i<=2;i++){
      setTimeout(()=>{
        const c=el.cloneNode(true);
        c.style.left=(sx+(Math.random()*44-22))+'px';
        c.style.setProperty('--sway',(Math.random()*90-45)+'px');
        flyBox.appendChild(c);
        setTimeout(()=>c.remove(),3200);
      },i*130);
    }
  }
}

function say(av,t){
  const b=av.tag.querySelector('.bb');b.textContent=t;b.hidden=false;
  clearTimeout(av.bt);av.bt=setTimeout(()=>b.hidden=true,5000);
  spawnFly('💬 '+av.name+': '+t,true,av);
}
function emo(av,e){
  const b=av.tag.querySelector('.em');b.textContent=e;b.hidden=false;
  av.ej=performance.now();
  clearTimeout(av.et2);av.et2=setTimeout(()=>b.hidden=true,2600);
  spawnFly(e,false,av);
}

// ---- Hệ thống Pháo Hoa 3D ăn mừng trong rạp ----
const fireworks=[];
const FW_COLORS=[0xff4d6d,0xffd24d,0x4dabff,0x5ee08a,0xb57bff,0xff9a4d,0x00f5d4];
function launchFirework(x,z){
  const color=FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  const rocket=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));
  const sx=(x!==undefined?x:(Math.random()*14-7));
  const sz=(z!==undefined?z:(-4-Math.random()*5));
  rocket.position.set(sx,.5,sz);
  scene.add(rocket);
  fireworks.push({
    stage:'rocket',
    mesh:rocket,
    vy:6.5+Math.random()*2.2,
    targetY:4.8+Math.random()*2.6,
    color
  });
}
function explodeFirework(pos,mainColor){
  const count=75;
  const geo=new THREE.BufferGeometry();
  const positions=new Float32Array(count*3);
  const colors=new Float32Array(count*3);
  const vels=[];
  const c1=new THREE.Color(mainColor);
  const c2=new THREE.Color(FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)]);
  for(let i=0;i<count;i++){
    positions[i*3]=pos.x;positions[i*3+1]=pos.y;positions[i*3+2]=pos.z;
    const theta=Math.random()*Math.PI*2;
    const phi=Math.acos(2*Math.random()-1);
    const speed=1.8+Math.random()*4.2;
    vels.push({
      x:Math.sin(phi)*Math.cos(theta)*speed,
      y:Math.sin(phi)*Math.sin(theta)*speed,
      z:Math.cos(phi)*speed
    });
    const mc=Math.random()>.35?c1:c2;
    colors[i*3]=mc.r;colors[i*3+1]=mc.g;colors[i*3+2]=mc.b;
  }
  geo.setAttribute('position',new THREE.BufferAttribute(positions,3));
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  const mat=new THREE.PointsMaterial({size:.22,vertexColors:true,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  scene.add(pts);
  const light=new THREE.PointLight(mainColor,3,18);
  light.position.copy(pos);
  scene.add(light);
  fireworks.push({stage:'sparks',pts,vels,light,age:0,life:1.7});
}
function celebrateFireworks(originAv){
  const ox=originAv?originAv.x:0;
  const oz=originAv?originAv.z-1.5:-5;
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      launchFirework(
        Math.max(-9,Math.min(9,ox+(Math.random()*8-4))),
        Math.max(-9,Math.min(6,oz+(Math.random()*5-2.5)))
      );
    },i*190);
  }
  if(originAv)spawnFly('🎆🎉✨',false,originAv);
}
function updateFireworks(dt){
  for(let i=fireworks.length-1;i>=0;i--){
    const fw=fireworks[i];
    if(fw.stage==='rocket'){
      fw.mesh.position.y+=fw.vy*dt;
      if(fw.mesh.position.y>=fw.targetY){
        const p=fw.mesh.position.clone();
        scene.remove(fw.mesh);
        fireworks.splice(i,1);
        explodeFirework(p,fw.color);
      }
    }else{
      fw.age+=dt;
      const posArr=fw.pts.geometry.attributes.position.array;
      for(let j=0;j<fw.vels.length;j++){
        const v=fw.vels[j];
        v.y-=3.8*dt;
        posArr[j*3]+=v.x*dt;
        posArr[j*3+1]+=v.y*dt;
        posArr[j*3+2]+=v.z*dt;
      }
      fw.pts.geometry.attributes.position.needsUpdate=true;
      const ratio=Math.max(0,1-fw.age/fw.life);
      fw.pts.material.opacity=ratio;
      fw.light.intensity=ratio*3;
      if(fw.age>=fw.life){
        scene.remove(fw.pts);
        scene.remove(fw.light);
        fw.pts.geometry.dispose();
        fw.pts.material.dispose();
        fireworks.splice(i,1);
      }
    }
  }
}

let me=null;const rem={};

// ---- WebSocket room ----
const WS_URL=/^(localhost|127\.)/.test(location.hostname)?'ws://localhost:8080':'wss://nice-8qyq.onrender.com';
function makeRoom(){
  const code=(new URLSearchParams(location.search).get('room')||'lobby').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,32)||'lobby';
  let ws,id=null,conn=false,peers=[];const ph=[],ch=[],hs={};
  const R={
    emit:async(t,d)=>{if(conn)ws.send(JSON.stringify({t:'emit',topic:t,data:d}))},
    on:(t,f)=>{(hs[t]=hs[t]||[]).push(f);return()=>{hs[t]=hs[t].filter(x=>x!==f)}},
    presence:async p=>{if(conn)ws.send(JSON.stringify({t:'presence',d:p}))},
    peers:()=>peers,
    onPeers:f=>{ph.push(f);return()=>{}},
    connected:()=>conn,
    onConnection:f=>{ch.push(f);return()=>{}}
  };
  function open(){
    try{ws=new WebSocket(WS_URL+'/?room='+code)}catch(e){setTimeout(open,3000);return}
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='hello'){id=m.id;conn=true;ch.forEach(f=>f(true));
        if(m.screen)(hs.screen||[]).forEach(f=>f({peer:'srv',sameTab:false,isMe:false,data:m.screen}))}
      else if(m.t==='peers'){const old=new Set(peers.map(p=>p.peer));
        peers=m.peers.map(p=>({peer:p.id,isMe:p.id===id,sameTab:p.id===id,kind:'viewer',presence:p.p}));
        const joined=peers.filter(p=>!old.has(p.peer));
        ph.forEach(f=>f({peers,joined,left:[],updated:[]}))}
      else if(m.t==='emit'){(hs[m.topic]||[]).forEach(f=>f({peer:m.id,sameTab:m.id===id,isMe:m.id===id,data:m.data}))}
    };
    ws.onclose=()=>{const was=conn;conn=false;if(was)ch.forEach(f=>f(false));setTimeout(open,2500)};
    ws.onerror=()=>{};
  }
  open();return R;
}

const vid=$('#vid');let curEmbed='';
function embedOf(u){
  try{const x=new URL(u),h=x.hostname.replace(/^www\.|^m\./,'');let id='';
    if(h==='youtu.be')id=x.pathname.slice(1);
    else if(h==='youtube.com')id=x.searchParams.get('v')||((x.pathname.match(/^\/(?:live|embed|shorts)\/([\w-]{6,})/)||[])[1]||'');
    if(/^[\w-]{6,15}$/.test(id))return'https://www.youtube.com/embed/'+id+'?autoplay=1&mute=1&playsinline=1&rel=0';
    if(h==='twitch.tv'){const c=x.pathname.split('/')[1];if(/^\w{3,25}$/.test(c))return'https://player.twitch.tv/?channel='+c+'&parent='+location.hostname+'&muted=true&autoplay=true'}
  }catch(e){}
  return'';
}
const cp=[new THREE.Vector3(-6,7.975,-9.95),new THREE.Vector3(6,7.975,-9.95),new THREE.Vector3(6,1.225,-9.95),new THREE.Vector3(-6,1.225,-9.95)];
function updateVid(){
  if(!curEmbed){if(vid.style.display!=='none')vid.style.display='none';return}
  cam.updateMatrixWorld();
  const q=cp.map(p=>p.clone().project(cam));
  if(q.some(p=>p.z>=1)){vid.style.display='none';return}
  const W=1280,H=720,P=q.map(p=>[(p.x*.5+.5)*innerWidth,(-p.y*.5+.5)*innerHeight]);
  const [x0,y0]=P[0],[x1,y1]=P[1],[x2,y2]=P[2],[x3,y3]=P[3];
  if(Math.abs(x1-x0)<60){vid.style.display='none';return}
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  const den=dx1*dy2-dx2*dy1;if(Math.abs(den)<1e-6){vid.style.display='none';return}
  const g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;
  const a=x1-x0+g*x1,b=y1-y0+g*y1,c=x0,d=x3-x0+h*x3,e=y3-y0+h*y3,f=y0;
  const s=vid.style;s.display='block';s.width=W+'px';s.height=H+'px';
  s.transform='matrix3d('+[a/W,b/W,0,g/W,d/H,e/H,0,h/H,0,0,1,0,c,f,0,1].join(',')+')';
  s.pointerEvents=me&&me.s>=0?'auto':'none';
}

// ---- room sync ----
const send=(t,d)=>{try{room&&room.emit(t,d).catch(()=>{})}catch(e){}};
let dirty=true,lastPush=0;
function push(){if(!room||!me)return;const now=performance.now();if(!dirty||now-lastPush<110)return;dirty=false;lastPush=now;
  room.presence({n:me.name,c:me.color,x:+me.x.toFixed(2),z:+me.z.toFixed(2),r:+me.r.toFixed(2),s:me.s,e:me.e||'',et:me.et}).catch(()=>{})}
function status(){const n=Object.keys(rem).length+1;$('#st').textContent=room&&room.connected()?'🟢 '+n+' người trong rạp':'⚪ Chơi một mình (chưa kết nối phòng)'}
async function connect(){
  try{room=makeRoom()}catch(e){room=null}
  if(!room){status();return}
  room.on('chat',m=>{const t=String(m.data&&m.data.t||'').slice(0,120);if(!t)return;
    const av=m.sameTab?me:rem[m.peer];const nm=av?av.name:'Ai đó';
    const col=av?av.color:'#ff4d6d';
    addLog(nm,t,col);if(av)say(av,t)},()=>{});
  room.on('firework',m=>{
    const av=m.sameTab?me:rem[m.peer];
    celebrateFireworks(av);
  },()=>{});
  room.on('screen',m=>{const d=m.data||{};if(m.sameTab)return;scr={t:String(d.t||'').slice(0,60)||'Trận đấu',u:okUrl(d.u),mine:false};syncScrUI()},()=>{});
  room.onPeers(ch=>{
    const seen=new Set();
    for(const p of ch.peers){
      if(p.isMe||p.kind!=='viewer')continue;const pr=p.presence||{};if(!pr.n)continue;seen.add(p.peer);
      let av=rem[p.peer];
      if(!av){av=rem[p.peer]=mkAv(String(pr.n).slice(0,14),/^#[0-9a-f]{6}$/i.test(pr.c)?pr.c:'#888888',false);av.x=+pr.x||0;av.z=+pr.z||0;av.px=av.x;av.pz=av.z}
      av.tx=+pr.x||0;av.tz=+pr.z||0;av.tr=+pr.r||0;av.s=Number.isInteger(pr.s)?pr.s:-1;
      if(pr.et&&pr.et!==av.et){
        av.et=pr.et;
        if(Date.now()-pr.et<4000){
          const emStr=String(pr.e).slice(0,4);
          if(emStr==='🎆')celebrateFireworks(av);
          else emo(av,emStr);
        }
      }
    }
    for(const k in rem)if(!seen.has(k)){document.body.removeChild(rem[k].tag);scene.remove(rem[k].g);delete rem[k]}
    if(ch.joined.some(p=>!p.isMe)&&scr.mine)setTimeout(()=>send('screen',{t:scr.t,u:scr.u}),400);
    dirty=true;status();
  },()=>{});
  room.onConnection(()=>{status();dirty=true},()=>{});
  status();
}
const okUrl=u=>{try{const x=new URL(String(u||''));return/^https?:$/.test(x.protocol)?x.href:''}catch(e){return''}};
function syncScrUI(){const a=$('#sop');if(scr.u){a.href=scr.u;a.style.display='';}else a.style.display='none';const e=embedOf(scr.u);if(e!==curEmbed){curEmbed=e;vid.src=e||'about:blank'}drawScr()}

// Hàm thêm tin nhắn livestream từ dưới đẩy lên
function addLog(name,text,color){
  const l=$('#log'),d=document.createElement('div');
  d.className='cmsg';
  if(text){
    const b=document.createElement('b');
    b.style.color=color||'#ff4d6d';
    b.textContent=name+':';
    d.appendChild(b);
    d.appendChild(document.createTextNode(' '+text));
  }else{
    d.textContent=name;
  }
  l.appendChild(d);
  while(l.children.length>7)l.removeChild(l.firstChild);
  setTimeout(()=>{
    d.classList.add('fade');
    setTimeout(()=>{if(d.parentNode)d.remove()},420);
  },16000);
}

// ---- UI ----
$('#bscr').onclick=()=>{const s=$('#scr');s.style.display=s.style.display==='flex'?'none':'flex'};
$('#sgo').onclick=()=>{scr={t:$('#stt').value.trim().slice(0,60)||'Trận đấu',u:okUrl($('#stu').value.trim()),mine:true};syncScrUI();send('screen',{t:scr.t,u:scr.u})};
$('#cf').onsubmit=e=>{e.preventDefault();const t=$('#ci').value.trim();if(!t||!me)return;$('#ci').value='';
  if(room&&room.connected())send('chat',{t});else{addLog(me.name,t,me.color);say(me,t)}};

function triggerFirework(){
  if(!me)return;
  me.e='🎆';me.et=Date.now();dirty=true;
  if(room&&room.connected())send('firework',{});
  else celebrateFireworks(me);
  addLog('🎉 '+me.name+' đã bắn pháo hoa ăn mừng!');
}

['👏','😂','🔥','❤️','👋','🍿','😮','🎆','🪑'].forEach(e=>{
  const b=document.createElement('button');b.textContent=e;

    if(!me)return;

  };

});

function toggleSit(){
  if(me.s>=0){me.s=-1;dirty=true;return}
  const taken=new Set(Object.values(rem).map(a=>a.s));let best=-1,bd=9;
  seats.forEach((s,i)=>{if(taken.has(i))return;const d=Math.hypot(s.x-me.x,s.z-me.z);if(d<bd){bd=d;best=i}});
  if(best>=0&&bd<2.6){me.s=best;dirty=true}else addLog('💡 Đi lại gần một chiếc ghế rồi bấm F hoặc 🪑 để ngồi');
}
$('#go').onclick=()=>{
  const n=$('#nm').value.trim().slice(0,14)||'Khách';
  me=mkAv(n,myColor,true);me.x=0;me.z=-.5;me.px=0;me.pz=-.5;me.e='';$('#ov').remove();started=true;connect();

};

// ---- input ----
const keys={};let joy={x:0,y:0};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();keys[k]=true;
  if(k==='f'&&me)toggleSit();
  if(k==='g'&&me)triggerFirework();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const jz=$('#joy'),kn=$('#kn');let jid=null;
function jm(e){const r=jz.getBoundingClientRect();let dx=(e.clientX-r.left-55)/45,dy=(e.clientY-r.top-55)/45;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}joy={x:dx,y:dy};kn.style.transform='translate('+dx*30+'px,'+dy*30+'px)'}
jz.addEventListener('pointerdown',e=>{jid=e.pointerId;jz.setPointerCapture(jid);jm(e)});
jz.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});
const jend=()=>{jid=null;joy={x:0,y:0};kn.style.transform=''};
jz.addEventListener('pointerup',jend);jz.addEventListener('pointercancel',jend);

// ---- loop & hoạt ảnh tay chân ----
const v3=new THREE.Vector3();
function place(av,t,dt){
  const sy=av.s>=0&&seats[av.s]?seats[av.s]:null;
  let x=sy?sy.x:av.x,z=sy?sy.z:av.z,y=sy?sy.y+.15:ground(av.z);

  // Tính tốc độ di chuyển để vung tay chân
  const dx=x-(av.px??x),dz=z-(av.pz??z);
  av.px=x;av.pz=z;
  const speed=Math.hypot(dx,dz)/Math.max(.001,dt);
  const moving=speed>.15&&!sy;
  if(moving)av.walk=(av.walk||0)+dt*11;

  const jt=(performance.now()-av.ej)/1000,jp=jt<1?Math.abs(Math.sin(jt*Math.PI*3))*.25:0;
  const bob=moving?Math.abs(Math.sin(av.walk*2))*.05:0;
  av.g.position.set(x,y+jp+bob,z);
  av.g.rotation.y=sy?Math.PI:av.r;

  // Hoạt ảnh tay chân
  if(sy){
    // Tư thế ngồi ghế
    av.legL.rotation.x=-Math.PI*.45;
    av.legR.rotation.x=-Math.PI*.45;
    av.armL.rotation.x=-.25;
    av.armR.rotation.x=-.25;
    av.armL.rotation.z=.1;
    av.armR.rotation.z=-.1;
  }else if(jt<1){
    // Đang nhảy thả emote -> giơ 2 tay vẫy ăn mừng
    av.armL.rotation.z=2.4+Math.sin(t*.02)*.35;
    av.armR.rotation.z=-2.4-Math.sin(t*.02)*.35;
    av.armL.rotation.x=0;av.armR.rotation.x=0;
    av.legL.rotation.x=.2;av.legR.rotation.x=-.2;
  }else if(moving){
    // Đang bước đi -> vung tay chân ngược chiều nhau
    const sw=Math.sin(av.walk);
    av.legL.rotation.x=sw*.65;
    av.legR.rotation.x=-sw*.65;
    av.armL.rotation.x=-sw*.55;
    av.armR.rotation.x=sw*.55;
    av.armL.rotation.z=.08;
    av.armR.rotation.z=-.08;
  }else{
    // Đứng yên thở nhẹ
    const idle=Math.sin(t*.003)*.05;
    av.legL.rotation.x=0;av.legR.rotation.x=0;
    av.armL.rotation.x=0;av.armR.rotation.x=0;
    av.armL.rotation.z=.08+idle;
    av.armR.rotation.z=-.08-idle;
  }

  v3.set(x,y+(sy?1.65:1.95),z).project(cam);
  av.tag.style.display=v3.z<1?'':'none';
  av.tag.style.transform='translate(-50%,-100%) translate('+((v3.x*.5+.5)*innerWidth)+'px,'+((-v3.y*.5+.5)*innerHeight)+'px)';
}

let last=performance.now(),lastDraw=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(me){
    let kx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
    let kz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
    const m=Math.hypot(kx,kz);
    if(m>.2){
      if(me.s>=0){me.s=-1;dirty=true}
      kx/=Math.max(1,m);kz/=Math.max(1,m);
      me.x=Math.max(-9.5,Math.min(9.5,me.x+kx*4*dt));me.z=Math.max(-8.8,Math.min(8,me.z+kz*4*dt));
      me.r=Math.atan2(kx,kz);dirty=true;
    }
    push();
    if(me.s>=0&&seats[me.s]){me.x=seats[me.s].x;me.z=seats[me.s].z}
    place(me,t,dt);
    const gy=ground(me.z),sit=me.s>=0;
    const tp=sit?new THREE.Vector3(me.x,gy+1.45,me.z+.3):new THREE.Vector3(me.x,gy+3.6,me.z+6.5);
    cam.position.lerp(tp,Math.min(1,dt*4));
    cam.lookAt(sit?v3.set(0,4.2,-9.8):v3.set(me.x,gy+1,me.z-2));
  }
  for(const k in rem){const a=rem[k];
    a.x+=((a.tx??a.x)-a.x)*Math.min(1,dt*9);a.z+=((a.tz??a.z)-a.z)*Math.min(1,dt*9);
    let d=((a.tr??a.r)-a.r+Math.PI*3)%(Math.PI*2)-Math.PI;a.r+=d*Math.min(1,dt*9);place(a,t,dt)}
  updateFireworks(dt);
  updateVid();
  if(t-lastDraw>500){lastDraw=t;drawScr();if(started)status()}
  ren.render(scene,cam);
}
cam.position.set(0,4,8);cam.lookAt(0,3,-8);drawScr();requestAnimationFrame(loop);
